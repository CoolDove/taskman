plugins {
    id 'com.android.application'
}

android {
    namespace 'app.dsh.running'
    compileSdk 34

    defaultConfig {
        applicationId "app.dsh.running"
        minSdk 23
        targetSdk 34
        versionCode 1
        versionName "0.1"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
}
